[package]
name = "lifehub"
version = "1.0.0"
description = "Persönliche Finance-, Life-, Planning- & Tracking-App"
authors = ["Erik"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
